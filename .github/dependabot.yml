version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Major mcp releases change the SDK API. Upgrade them in a planned PR.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
